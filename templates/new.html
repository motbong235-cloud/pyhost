{% extends "base.html" %}
{% block title %}New project — {{ app_name }}{% endblock %}
{% block content %}
<div class="max-w-3xl mx-auto px-4 py-8">
  <h1 class="text-2xl font-extrabold mb-6">New Python Project</h1>
  <form method="post" class="space-y-4">
    <div>
      <label class="text-xs font-semibold text-slate-400">Title</label>
      <input name="title" class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm" placeholder="My Flask App" required />
    </div>
    <div>
      <label class="text-xs font-semibold text-slate-400">Description</label>
      <input name="description" class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm" placeholder="ខ្លីៗ..." />
    </div>
    <div>
      <label class="text-xs font-semibold text-slate-400">app.py (optional — បន្ថែម file ក្រោយបាន)</label>
      <textarea name="main_code" rows="14" class="mono w-full mt-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-3 text-sm" placeholder="from flask import Flask
app = Flask(__name__)

@app.get('/')
def home():
    return 'Hello from PyHost'

if __name__ == '__main__':
    app.run(host='0.0.0.0', port=8080)
"></textarea>
    </div>
    <div>
      <label class="text-xs font-semibold text-slate-400">requirements.txt</label>
      <textarea name="requirements" rows="3" class="mono w-full mt-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm">Flask>=3.0.0
gunicorn>=21.0.0</textarea>
    </div>
    <label class="flex items-center gap-2 text-sm text-slate-400">
      <input type="checkbox" name="private" value="1" /> Private project
    </label>
    <button class="px-6 py-2.5 rounded-xl bg-blue-500 hover:bg-blue-400 text-white font-bold text-sm">Create project</button>
  </form>
</div>
{% endblock %}
